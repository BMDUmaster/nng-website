<!doctype html>

<head>

<style>
  /* Maintenance page for nngarg.com while the website is being updated. Self-contained: no build, no scripts. */
  :root { --pearl: #FAF6F0; --plum: #3C183D; --ink: #231E25; --gold: #D7B86B; --brass: #B88A45; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    background: radial-gradient(70% 60% at 85% 0%, rgb(215 184 107 / 0.16), transparent 70%), linear-gradient(150deg, #4A2049, var(--plum) 50%, var(--ink));
    color: var(--pearl);
    font-family: Manrope, system-ui, sans-serif;
  }
  .page { display: grid; grid-template-rows: auto 1fr auto; width: min(1120px, 100% - 40px); margin-inline: auto; }
  header { padding-top: 22px; }
  header img { display: block; width: 104px; height: auto; border-radius: 4px; }
  main { display: grid; align-items: center; gap: 36px; padding-block: 36px; }
  .copy { max-width: 560px; }
  .kicker { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 14px 0 0; font-family: Marcellus, Georgia, serif; font-weight: 400; font-size: clamp(36px, 9vw, 64px); line-height: 1.05; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: var(--gold); }
  .lead { margin: 18px 0 0; font-size: 16.5px; line-height: 1.7; color: rgb(250 246 240 / 0.82); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 5px 5px 5px 22px; border-radius: 999px; font-size: 14.5px; font-weight: 700; text-decoration: none; }
  .btn-main { background: var(--gold); color: var(--plum); box-shadow: 0 14px 28px -16px rgb(184 138 69 / 0.9); }
  .btn-main span { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: #25D366; color: #fff; }
  .btn-main svg { width: 20px; height: 20px; }
  .btn-line { padding-right: 22px; color: var(--pearl); box-shadow: inset 0 0 0 1px rgb(215 184 107 / 0.5); }
  .btn:hover { transform: translateY(-1px); }
  .reach { display: grid; gap: 6px; margin: 26px 0 0; padding: 0; list-style: none; font-size: 14.5px; color: rgb(250 246 240 / 0.78); }
  .reach a { color: var(--pearl); text-decoration: none; border-bottom: 1px solid rgb(215 184 107 / 0.45); }
  figure { justify-self: center; margin: 0; width: min(300px, 70vw); }
  .arch { overflow: hidden; aspect-ratio: 684 / 1000; border-radius: 999px 999px 22px 22px; box-shadow: 0 0 0 1px rgb(215 184 107 / 0.55), 0 0 0 8px rgb(215 184 107 / 0.08), 0 40px 70px -40px rgb(0 0 0 / 0.7); }
  .arch img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
  figcaption { margin: -26px auto 0; position: relative; width: max-content; max-width: 100%; padding: 10px 22px; border-radius: 999px; background: var(--pearl); color: var(--plum); text-align: center; font-family: Marcellus, Georgia, serif; font-size: 19px; }
  figcaption small { display: block; margin-top: 2px; font-family: Manrope, system-ui, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass); }
  footer { padding: 18px 0 24px; border-top: 1px solid rgb(250 246 240 / 0.12); font-size: 12.5px; color: rgb(250 246 240 / 0.55); }
  @media (min-width: 860px) {
    main { grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 64px; }
    figure { justify-self: end; width: 320px; }
  }
</style>
</head>

        <a class="btn btn-line" href="tel:+919205511101">Call +91 92055 11101</a>

    </div>
    <figure>

      <figcaption>Narayani Garg<small>Psychic Spiritual Mentor</small></figcaption>
    </figure>
  </main>
  <footer>Transformation with NNG · Narayani Garg</footer>
</div>
</body>
</html>
